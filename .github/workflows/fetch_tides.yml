name: Fetch tide predictions

on:
  schedule:
    - cron: "0 6 * * *"  # every day at 06:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to push updated data files back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fetch script
        run: python fetch_tides.py

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: update tide data [skip ci]"
          git push
