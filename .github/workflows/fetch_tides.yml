name: Fetch tide predictions

on:
  schedule:
    - cron: "0 6 * * *"  # Runs every day at 06:00 UTC
  workflow_dispatch:     # Allows you to run this manually from the Actions tab

jobs:
  fetch_and_match:
    runs-on: ubuntu-latest

    permissions:
      contents: write    # Required to push changes back to the repository

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fetch script
        run: python fetch_tides.py

      - name: Run matcher script
        run: python matcher.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes (new tide data and matched results)
          git add .
          
          # Only commit and push if there are actual changes to save
          if ! git diff --cached --quiet; then
            git commit -m "chore: update tide data and matches [skip ci]"
            git push
          else
            echo "No changes detected, skipping push."
          fi
